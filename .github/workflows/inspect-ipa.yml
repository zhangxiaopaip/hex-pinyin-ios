name: inspect-ipa

# One-off diagnostic: unpack the built IPA and report what actually shipped
# (does HEXKeyboard.appex contain the pinyin dictionary, and how big is it?).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id holding the hex-ipa artifact
        required: true
        default: "45778067435"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hex-ipa
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out

      - name: Report the pinyin dictionary
        run: |
          set -euo pipefail
          for ipa in $(find out -name '*.ipa'); do
            echo "== $ipa =="
            unzip -l "$ipa" | grep -i -E "Wanxiang|HEXKeyboard.appex/$" || true
          done
