name: Build iOS IPA

# Builds Hex Mobile, its keyboard and its widgets into an unsigned .ipa on a GitHub macOS
# runner, so the app can be installed without Xcode Cloud or an Apple Developer account:
# Sideloadly (Windows or Mac) signs the .ipa with your own Apple ID as it installs it.
#
# Two archives come out of one run. The first is the app as the repo ships it, App Group and
# App Store identifiers intact. The second rewrites the identifiers to the prefix below and
# drops the App Group, which a free Apple ID cannot sign; try it when the first refuses to
# sign because anomaly.hex.mobile is already taken.
on:
  workflow_dispatch:
    inputs:
      personal_prefix:
        description: Bundle identifier prefix for the App-Group-free .ipa
        type: string
        default: com.example.hex

permissions:
  contents: read

concurrency:
  group: build-ios-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The app links FoundationModels and compiles Icon Composer's .icon, both of which are
      # Xcode 26's; an older Xcode fails here rather than producing a quietly wrong app. The
      # newest is also the one least likely to crash in IRGen, which Xcode 26.0.1's 6.2 does
      # while emitting a reabstraction thunk from FluidAudio.
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          chosen=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V 2>/dev/null | tail -1)
          # sort -V is BSD's too new to count on; the plain order is the fallback.
          [ -n "$chosen" ] || chosen=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
          if [ -z "$chosen" ]; then
            echo "No Xcode on this runner" >&2
            exit 1
          fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          echo "Using $chosen"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/^Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "Xcode 26 or newer is needed; this runner offers $major." >&2
            exit 1
          fi

      - name: Ensure an iOS SDK
        run: |
          set -o pipefail
          # A runner image can advertise iphoneos in -showsdks while the platform itself is
          # still a stub that has to be downloaded, and the archive then has no destination to
          # aim at ("iOS 26.0 is not installed"). A real SDK carries SDKSettings.plist; a stub
          # does not, which is how this tells them apart.
          sdk_path() { xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true; }
          has_sdk() { p=$(sdk_path); [ -n "$p" ] && [ -f "$p/SDKSettings.plist" ]; }

          xcodebuild -showsdks | grep -i iphoneos || true
          if has_sdk; then
            echo "iOS SDK present: $(sdk_path)"
            exit 0
          fi
          # Asking for a platform that is already there is a no-op; asking can also fail on a
          # busy runner ("Unable to connect to simulator", exit 70), so try again before
          # giving up rather than failing a five-minute build on a transient.
          for attempt in 1 2 3; do
            if sudo xcodebuild -downloadPlatform iOS; then break; fi
            echo "downloadPlatform failed (attempt $attempt)"
            sleep 20
          done
          if ! has_sdk; then
            echo "No iOS SDK after downloading it" >&2
            xcodebuild -showsdks || true
            exit 1
          fi
          echo "iOS SDK: $(sdk_path)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Archive as it ships
        working-directory: ios
        run: IPA_NAME="Hex-unsigned" sh scripts/build-ipa.sh

      - name: Archive for a free Apple ID
        working-directory: ios
        env:
          PERSONAL_PREFIX: ${{ inputs.personal_prefix }}
          IPA_NAME: Hex-personal
          BUILD_DIR: ${{ github.workspace }}/ios/build/ipa-personal
        run: sh scripts/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hex-ipa
          path: ios/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
